<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="src/lib/core_v36.js"></script>
<script src="src/lib/character_v36.js"></script>
<script>
const cv=document.getElementById('out'), ctx=cv.getContext('2d');
buildTextures(); initPatterns(ctx);
const COLORS={body:'#2a1e19',hand:'#a96f51',fold:'rgb(59,58,44)',tie:'#6f3d24',neck:'#7a4a34',eye:'#2a1c17',mouth:'#3a241d',lip:'#a06a4e',brow:'#2e201b',hair:'#221a18'};
const q=new URLSearchParams(location.search);
window.__ONLY_COLOR__ = q.get('c') ? COLORS[q.get('c')] : null;
console.log('ONLY',window.__ONLY_COLOR__);
function draw(t=0){
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#ddd2bd'; ctx.fillRect(0,0,W,H);
  drawPerson(ctx,t,{who:'mu',x:360,y:1500,h:850,turn:.25,expression:'soft',pose:{lean:.03,handL:[-.13,-.32],handR:[.12,-.34]},seed:7,light:{x:-.5,y:-.8,color:'#ffe0b0',rim:.45}});
  return cv.toDataURL('image/jpeg',.95);
}
window.renderAt=(t)=>draw(t); window.ready=true;
</script></body></html>
