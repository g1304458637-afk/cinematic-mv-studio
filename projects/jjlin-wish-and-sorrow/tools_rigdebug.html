<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="src/lib/core.js?v=15"></script>
<script src="src/lib/character.js?v=15"></script>
<script>
const cv=document.getElementById('out'), ctx=cv.getContext('2d');
buildTextures(); initPatterns(ctx);
const trace={on:false};
for(const m of ['moveTo','lineTo','quadraticCurveTo','bezierCurveTo']){
  const orig=CanvasRenderingContext2D.prototype[m];
  CanvasRenderingContext2D.prototype[m]=function(...a){
    if(trace.on){ const bad=a.filter(v=>typeof v==='number'&&Math.abs(v)>0.9); if(bad.length) console.log('FAR',m,a.map(v=>typeof v==='number'?v.toFixed(2):v).join(','), new Error().stack.split('\n')[2]); }
    return orig.apply(this,a);
  };
}
const os=CanvasRenderingContext2D.prototype.stroke;
CanvasRenderingContext2D.prototype.stroke=function(...a){
  if(trace.on && this.lineWidth>0.02) console.log('STROKE',this.lineWidth.toFixed(3),this.strokeStyle,new Error().stack.split('\n')[2]);
  return os.apply(this,a);
};
function draw(t=0){
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#ddd2bd'; ctx.fillRect(0,0,W,H);
  trace.on=true; window.__TRACEINK__=true;
  window.__NO_EDGE__=true; drawPerson(ctx,t,{who:'mu',x:300,y:1500,h:850,turn:.25,expression:'soft',pose:{lean:.03,handL:[-.18,-.47],handR:[.17,-.45]},seed:7});
  trace.on=false; window.__TRACEINK__=false;
  return cv.toDataURL('image/jpeg',.95);
}
window.renderAt=(t)=>draw(t); window.ready=true;
</script></body></html>
