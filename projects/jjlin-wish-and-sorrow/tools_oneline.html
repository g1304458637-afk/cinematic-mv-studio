<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="src/lib/core_v36.js"></script>
<script>
const cv=document.getElementById('out'), ctx=cv.getContext('2d');
buildTextures(); initPatterns(ctx);
function draw(t=0){
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#ddd2bd'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(540,960); ctx.scale(850,850);
  inkStroke(ctx,[[-.10,-.50],[.10,-.50]],{w:.0042,color:'red',bristle:false});
  inkStroke(ctx,[[-.10,-.40],[.10,-.40]],{w:.0042,color:'green',bristle:true});
  ctx.strokeStyle='blue'; ctx.lineWidth=.0042; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-.10,-.30); ctx.lineTo(.10,-.30); ctx.stroke();
  ctx.restore();
  return cv.toDataURL('image/jpeg',.95);
}
window.renderAt=(t)=>draw(t); window.ready=true;
</script></body></html>
