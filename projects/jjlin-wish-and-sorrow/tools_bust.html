<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="src/lib/core_v38.js"></script>
<script src="src/lib/character_v38.js"></script>
<script>
const cv=document.getElementById('out'), ctx=cv.getContext('2d');
buildTextures(); initPatterns(ctx);
function draw(t=0){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(700,500,100,700,700,1200); g.addColorStop(0,'#4d5347'); g.addColorStop(.5,'#2c332f'); g.addColorStop(1,'#141a18');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // warm lamp from left
  glow(ctx,280,520,600,'#e8b86a',.28);
  drawPerson(ctx,t,{who:'mu',x:540,y:2360,h:1900,turn:.22,expression:'soft',pose:{lean:.02,handL:[-.1,-.25],handR:[.1,-.26]},seed:7,light:{x:-.6,y:-.7,color:'#ffd9a0',rim:.65}});
  paperOverlay(ctx,t,.14); vignette(ctx,.55); filmGrain(ctx,0,.03);
  return cv.toDataURL('image/jpeg',.95);
}
window.renderAt=(t)=>draw(t); window.ready=true;
</script></body></html>
