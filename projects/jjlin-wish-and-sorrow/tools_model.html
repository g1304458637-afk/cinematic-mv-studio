<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="src/lib/core.js?v=60"></script>
<script src="src/lib/character.js?v=60"></script>
<script src="src/lib/props.js?v=60"></script>
<script src="src/custom_shots.js?v=60"></script>
<script>
const cv=document.getElementById('out'), ctx=cv.getContext('2d');
buildTextures(); initPatterns(ctx);
function draw(t=0){
  ctx.fillStyle='#e8dcc6'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle='#cbbda4'; for(let i=0;i<80;i++){ctx.beginPath();ctx.arc(hash2(2000,i)*W,hash2(2001,i)*H,20+hash2(2002,i)*80,0,TAU);ctx.fill();} ctx.restore();
  ctx.fillStyle='#241f19'; ctx.textAlign='left'; ctx.font='700 64px "Noto Serif CJK SC","Songti SC",serif'; ctx.fillText('最后的果园',70,120);
  ctx.font='500 26px "Noto Serif CJK SC","Songti SC",serif'; ctx.fillText('CHARACTER MODEL SHEET  ·  ink-silhouette language',72,165);
  const posesM=[{lean:.02,handL:[-.1,-.3],handR:[.1,-.3]},{lean:.08,handL:[-.12,-.3],handR:[.22,-.34]},{pelvisY:-.34,lean:.7,handL:[-.1,-.08],handR:[.1,-.1]}];
  const posesC=[{lean:-.02,handL:[-.1,-.3],handR:[.1,-.3]},{lean:-.08,handL:[-.2,-.34],handR:[.12,-.3]},{pelvisY:-.38,lean:-.6,handL:[-.12,-.12],handR:[.12,-.1]}];
  ctx.font='600 30px "Noto Serif CJK SC","Songti SC",serif';
  ctx.fillStyle='#2a241c'; ctx.fillText('MU / 暮',90,260); ctx.fillText('CHEN / 尘',620,260);
  for(let i=0;i<3;i++){
    drawSilhouette(ctx,t,{who:'mu',x:200+i*130,y:1080,h:680,turn:.35,pose:posesM[i],rim:'#f2cf92',rimAlpha:.5,seed:3+i});
    drawSilhouette(ctx,t,{who:'chen',x:650+i*120,y:1090,h:700,turn:-.35,pose:posesC[i],rim:'#cfe0e8',rimAlpha:.5,seed:7+i});
  }
  // palette
  const cols=['#14110f','#a86137','#b9d98a','#1d3434','#f0c477','#a9c5c8','#e8dcc6'];
  ctx.font='500 22px "Noto Serif CJK SC","Songti SC",serif'; ctx.fillStyle='#2a241c';
  cols.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(90+i*130,1240,110,60);ctx.strokeStyle='#2a241c';ctx.lineWidth=1;ctx.strokeRect(90+i*130,1240,110,60);ctx.fillStyle='#2a241c';ctx.fillText(c,92+i*130,1330);});
  ctx.fillStyle='#2a241c'; ctx.font='500 24px "Noto Serif CJK SC","Songti SC",serif';
  ctx.fillText('Motifs: paper crane · seed pod · glass · tally · rain',90,1430);
  ctx.fillText('Silhouette carries pose; colour is reserved for seed (green), scarf (amber), signal (red).',90,1470);
  ctx.fillText('Close-ups: eye, hands, seed, crane. No detailed lip-sync is claimed.',90,1510);
  // eye + hand crops
  ctx.save(); ctx.translate(300,1660); ctx.fillStyle='#3a2c22'; ctx.fillRect(-210,-120,420,250); ctx.strokeStyle='#2a1c17'; ctx.lineWidth=8; ctx.beginPath(); ctx.ellipse(0,0,120,55,0,0,TAU); ctx.stroke();
  ctx.fillStyle='#e8d7bd'; ctx.beginPath(); ctx.ellipse(0,0,110,45,0,0,TAU); ctx.fill(); ctx.fillStyle='#4a2d1d'; ctx.beginPath(); ctx.arc(20,0,32,0,TAU); ctx.fill(); ctx.fillStyle='#0d0908'; ctx.beginPath(); ctx.arc(20,0,15,0,TAU); ctx.fill(); ctx.fillStyle='rgba(255,246,220,.9)'; ctx.beginPath(); ctx.arc(8,-12,5,0,TAU); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(800,1660); ctx.fillStyle='#3a2c22'; ctx.fillRect(-210,-120,420,250);
  drawHandSil(ctx,0,40,1.6,-1,{spread:.7,curl:.4},{rim:'#ffd9a0',rimAlpha:.7,lit:true}); ctx.restore();
  ctx.fillStyle='#2a241c'; ctx.font='500 22px "Noto Serif CJK SC","Songti SC",serif'; ctx.fillText('eye / recognition',170,1820); ctx.fillText('hand / touch',710,1820);
  return cv.toDataURL('image/jpeg',.95);
}
window.renderAt=(t)=>draw(t); window.ready=true;
</script></body></html>
