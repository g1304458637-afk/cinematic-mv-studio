<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="src/lib/core_v44.js"></script>
<script src="src/lib/character_v44.js"></script>
<script src="src/lib/sets_v44.js"></script>
<script src="src/lib/props_v44.js"></script>
<script>
const cv=document.getElementById('out'), ctx=cv.getContext('2d');
buildTextures(); initPatterns(ctx);
const q=new URLSearchParams(location.search); const scene=q.get('s')||'ash';
function draw(t=0){
  ctx.clearRect(0,0,W,H);
  const cam={x:540,y:960,zoom:1,rot:0,shake:0,seed:1,frame:0};
  if(scene==='ash'){
    setAshwide(ctx,t,cam,{dawn:0,domeOn:1,arkOn:1});
  } else if(scene==='tree'){
    const cam2={x:540,y:1000,zoom:1.05,rot:0,shake:0,seed:2,frame:0};
    setValley(ctx,t,cam2,{stage:3,storm:.7,rainOn:1});
    ctx.save(); applyCam(ctx,cam2,1,false);
    drawPerson(ctx,t,{who:'mu',x:470,y:1600,h:420,turn:.5,expression:'resolve',pose:{lean:.1,handL:[-.08,-.3],handR:[.1,-.32]},seed:9});
    drawPerson(ctx,t,{who:'chen',x:610,y:1610,h:450,turn:-.5,expression:'resolve',pose:{lean:-.05,handL:[-.1,-.3],handR:[.08,-.31]},seed:11});
    ctx.restore();
  } else if(scene==='pool'){
    setPool(ctx,t,cam,{});
  } else if(scene==='orchard'){
    setOrchard(ctx,t,cam,{night:false,storm:0,broken:0,tree:.2,warm:1});
  }
  paperOverlay(ctx,t,.16); vignette(ctx,.5); filmGrain(ctx,0,.03);
  return cv.toDataURL('image/jpeg',.95);
}
window.renderAt=(t)=>draw(t); window.ready=true;
</script></body></html>
